# JDK 21 обязателен: на нём должен стартовать сам демон Gradle (плагины Jmix/Spring Boot
# требуют JVM 17+), поэтому одного toolchain'а в build.gradle не хватает.
#
# Штатный способ — указать JAVA_HOME на JDK 21 перед сборкой:
#   Linux/macOS:  export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
#   Windows:      set JAVA_HOME=C:\Program Files\Java\jdk-21
#
# Либо раскомментировать строку ниже и подставить свой путь:
# org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# Hilla (Vaadin's TypeScript/React stack) is not used in this project.
hilla.active=false
