# Test profile: isolated in-memory HSQLDB so tests never touch the dev database.
main.datasource.url=jdbc:hsqldb:mem:equipment_test
main.datasource.username=sa
main.datasource.password=
main.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

jmix.core.project-id=equipment-requests
main.liquibase.change-log=com/debugskills/equipment/liquibase/changelog.xml

# UI wiring (must match main config so the security filter chain finds the login view)
jmix.ui.login-view-id=equipment_LoginView
jmix.ui.main-view-id=equipment_MainView
jmix.ui.menu-config=com/debugskills/equipment/menu.xml
jmix.ui.composite-menu=true

jmix.core.available-locales=en
spring.messages.basename=com/debugskills/equipment/messages

vaadin.launch-browser=false
vaadin.pnpm.enable=false
vaadin.productionMode=false
